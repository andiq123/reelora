name: Latest APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-apk
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Prepare signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/reelora-release.jks"

      - name: Test and build
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/reelora-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk ReeloraTV-latest.apk
          sha256sum ReeloraTV-latest.apk > ReeloraTV-latest.apk.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: ReeloraTV-latest
          path: |
            ReeloraTV-latest.apk
            ReeloraTV-latest.apk.sha256

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^appVersionName=//p' gradle.properties)"
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest ReeloraTV-latest.apk ReeloraTV-latest.apk.sha256 --clobber
            gh release edit latest --title "Reelora TV $version" --notes "Latest tested build from main." --latest
          else
            gh release create latest ReeloraTV-latest.apk ReeloraTV-latest.apk.sha256 --title "Reelora TV $version" --notes "Latest tested build from main." --latest
          fi
